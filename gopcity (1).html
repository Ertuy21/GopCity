document.getElementById('b4').onclick=()=>{pan.innerHTML=(TM?'ПАЛЕЦ СЛЕВА — джойстик (ходьба / руль)<br>ОГОНЬ — стрелять (веди палец — прицел, без прицела — автонаведение на врагов)<br>E — действие (двери, ларёк, машина, разговор)<br>ОРУЖ — сменить оружие · БЕГ — бег · ТОРМ — тормоз в машине · R — радио<br>☰ — меню / пауза · Лучше играть в горизонтальном режиме<br><br>':'')+'WASD — ходьба / руль<br>Shift — бег<br>Мышь — прицел, ЛКМ или Пробел — огонь<br>E — действие (двери, ларёк, машина, разговор)<br>Удерживай Tab или Q — колесо оружия (как в GTA), 1–6 — быстрый выбор.<br>R — радио в машине · E у прохожих — поболтать<br>Esc — меню<br>Цель: следуй за жёлтой стрелкой. Бутылки сдавай в ларёк.'};
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
if(CH2&&st=='play'){const d=+e.code.replace('Digit','');if(d>=1&&d<=CH2.o.length)pickC(d-1);else if(e.code=='Escape'||e.code=='KeyE')CH2=null;return}
if(e.code=='Escape'){wheel=0;if(invO){invShow();return}if(st=='play')showM();else if(started){st='play';hide()}return}if(st!='play')return;
if(e.code=='KeyE')use();if(e.code=='KeyI')invShow();if(e.code=='KeyR'&&drive){radio=(radio+1)%4;say('Радио',['Выключено.','«Шансон»: для вас, дорогие водители!','«Ковылкино FM»: дискотека девяностых, зажигаем!','«Маяк»: новости и погода. В Ковылкино — без осадков, но с ветерком.'][radio]);snd(500,.08)}if((e.code=='Tab'||e.code=='KeyQ')&&!wheel&&!inHome){wheel=1;wsel=P.w}
const d=+e.code.replace('Digit','');if(d>=1&&d<=WP.length&&P.has[d-1])P.w=d-1});
addEventListener('keyup',e=>{keys[e.code]=0;if((e.code=='Tab'||e.code=='KeyQ')&&wheel){wheel=0;if(P.has[wsel])P.w=wsel}});
cv.addEventListener('mousemove',e=>{mx=e.clientX/innerWidth*W;my=e.clientY/innerHeight*H});
cv.addEventListener('mousedown',e=>{md=true;mx=e.clientX/innerWidth*W;my=e.clientY/innerHeight*H;if(CH2&&CH2.oy!=null){const i=Math.floor((my-CH2.oy)/(CH2.rh||10));if(i>=0&&i<CH2.o.length)pickC(i);md=false;return}if(st=='play'&&started)ac=ac||(()=>{try{return new AudioContext()}catch(x){}})()});
addEventListener('mouseup',()=>md=false);
function applyTouch(){TM=!!cfg.touch;S=TM?2:3;rs();tcShow()}
const tc=document.getElementById('tc'),jb=document.getElementById('jb'),jk=document.getElementById('jk'),tF=document.getElementById('tF'),tA=document.getElementById('tA'),tW=document.getElementById('tW'),tR=document.getElementById('tR'),tM=document.getElementById('tM'),tO=document.getElementById('tO');
let jid=null,jx0=0,jy0=0,fid=null;
function tcShow(){tc.style.display=TM&&st=='play'&&started?'block':'none'}
function tcUp(){tc.classList.toggle('dlg',!!CH2||!!wheel);tc.classList.toggle('car',!!drive);tW.textContent=WP[P.w].n;tR.textContent=drive?'ТОРМ':'БЕГ';tR.classList.toggle('tog',!!runOn&&!drive);tO.style.display=drive?'flex':'none'}
const kp=c=>{dispatchEvent(new KeyboardEvent('keydown',{code:c}));dispatchEvent(new KeyboardEvent('keyup',{code:c}))};
const bind=(el,dn,up)=>{el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();dn(e.changedTouches[0]);el.classList.add('on')},{passive:false});const u=e=>{e.preventDefault();el.classList.remove('on');up&&up(e.changedTouches[0])};el.addEventListener('touchend',u,{passive:false});el.addEventListener('touchcancel',u,{passive:false})};
bind(tF,t=>{fid=t.identifier;fireB=1;aimD=null});
const tU=document.getElementById('tU'),tD=document.getElementById('tD'),tL=document.getElementById('tL'),tG=document.getElementById('tG'),tI=document.getElementById('tI');
bind(tU,()=>cU=1,()=>cU=0);bind(tD,()=>cD=1,()=>cD=0);bind(tL,()=>cL=1,()=>cL=0);bind(tG,()=>cG=1,()=>cG=0);bind(tI,()=>invShow());
function invShow(){const d=document.getElementById('inv');invO=!invO;if(!invO){d.style.display='none';return}joy.x=joy.y=0;d.style.display='block';invRender()}
function invRender(){const d=document.getElementById('inv');let h=`<h2>Инвентарь</h2><p>₽ ${P.money} · ХП ${Math.round(P.hp)} · бутылок: ${P.bottles}</p><p>Задание: ${Q<QS.length?QS[Q]:'свободная игра'}</p><h3>Оружие</h3>`;
WP.forEach((w,i)=>{if(P.has[i])h+=`<button data-w=${i} class=${P.w==i?'ibs':'ib'}>${w.n}${w.m?'':' · '+P.ammo[i]+' патр.'}</button>`});
h+=`<h3>Предметы</h3><button data-u=pir class=ib>Мамины пирожки ×${P.inv.pir} (+30 ХП)</button><button data-u=apt class=ib>Аптечка ×${P.inv.apt} (+60 ХП)</button><p><button id=invx class=ib>Закрыть</button></p>`;
d.innerHTML=h;d.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{P.w=+b.dataset.w;invRender()});d.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const k=b.dataset.u;if(!P.inv[k]||P.hp>=100)return;P.inv[k]--;P.hp=Math.min(100,P.hp+(k=='pir'?30:60));snd(600,.1);invRender()});document.getElementById('invx').onclick=invShow}
bind(tA,()=>kp('KeyE'));bind(tM,()=>kp('Escape'));bind(tO,()=>kp('KeyR'));
bind(tR,()=>{if(drive)brkB=1;else runOn=!runOn},()=>{brkB=0});
bind(tW,()=>{if(inHome)return;let i=P.w;for(let k=0;k<WP.length;k++){i=(i+1)%WP.length;if(P.has[i]){P.w=i;break}}snd(500,.04)});
addEventListener('touchstart',e=>{if(!TM){cfg.touch=1;applyTouch()}if(st!='play'||!started||invO)return;
for(const t of e.changedTouches){if(CH2){mx=t.clientX/innerWidth*W;my=t.clientY/innerHeight*H;if(CH2.oy!=null){const i=Math.floor((my-CH2.oy)/(CH2.rh||10));if(i>=0&&i<CH2.o.length)pickC(i)}e.preventDefault();continue}
if(jid===null&&t.clientX<innerWidth*.55&&t.clientY>innerHeight*.12&&!drive){jid=t.identifier;jx0=t.clientX;jy0=t.clientY;jb.style.cssText='display:block;left:'+(jx0-55)+'px;top:'+(jy0-55)+'px';jk.style.transform='translate(0,0)';e.preventDefault()}}},{passive:false});
addEventListener('touchmove',e=>{for(const t of e.changedTouches){
if(t.identifier===jid){let dx=t.clientX-jx0,dy=t.clientY-jy0;const l=Math.hypot(dx,dy),R=55;if(l>R){dx*=R/l;dy*=R/l}jk.style.transform='translate('+dx+'px,'+dy+'px)';const f=Math.hypot(dx,dy)<9?0:1;joy.x=f*dx/R;joy.y=f*dy/R}
if(t.identifier===fid){const r=tF.getBoundingClientRect(),dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);aimD=Math.hypot(dx,dy)>28?Math.atan2(dy,dx):null}}
if(jid!==null||fid!==null)e.preventDefault()},{passive:false});
const tEnd=e=>{for(const t of e.changedTouches){if(t.identifier===jid){jid=null;joy.x=joy.y=0;jb.style.display='none'}if(t.identifier===fid){fid=null;fireB=0;aimD=null}}};
addEventListener('touchend',tEnd);addEventListener('touchcancel',tEnd);
document.getElementById('b5').onclick=()=>{const e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen;if(!f){pan.textContent='Полный экран тут недоступен. На iPhone: Поделиться → На экран «Домой».';return}Promise.resolve(f.call(e)).then(()=>screen.orientation.lock('landscape')).catch(()=>{})};
let last=0,acc=0;gen0();started=false;tcShow();
function loop(ts){requestAnimationFrame(loop);acc+=Math.min(100,ts-last);last=ts;while(acc>16.7){acc-=16.7;if(st=='play'&&!wheel&&!CH2&&!invO)upd()}if(TM)tcUp();draw()}
requestAnimationFrame(loop);
</script></body></html>
